name: E2E Tests

# Runs only on the `dev` -> `main` promotion pull request, beside `Checks`. An author
# runs `make test-e2e` before a change reaches `dev`; CI runs it once per promotion
# rather than once per merge. No `push` trigger, for the reason `checks.yml` gives
# (ADR 0028).
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
      # Pulls garam's private test image, which `make garam-e2e` copies garam,
      # its test-principal fixture and its migrations out of (#271). The package
      # grants this repository's Actions read access in its own settings.
      packages: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      # Dependabot moves the action pins below, rewriting the version comment with
      # the SHA (`.github/dependabot.yml`) — but only while the two already agree,
      # and only while the version is the last word on the line. `make verify-pins`
      # fails when either stops holding.
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # `make test-e2e` installs kind itself, at the version the Makefile pins, so
      # this job holds no kind version of its own. helm/kind-action would put that
      # version and the cluster back here, where a contributor's command cannot
      # reach either.
      # The login `make garam-e2e` pulls ghcr.io/garamsh/garam-test with, as this
      # run's GITHUB_TOKEN. The action logs out again at the end of the job, so
      # no credential outlives it.
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the e2e tests
        run: make test-e2e
