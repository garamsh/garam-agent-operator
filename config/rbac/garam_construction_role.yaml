# permission to build the agents this operator renders from the control
# service's desired feed, in the operator's own namespace, which is where they
# are built. The reads it makes of an Agent and of a Secret are already granted
# by the reconciler's own role; what is left is creating the Agent and the
# Secrets placed beside it, and patching the spec each later revision renders.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: garam-agent-operator
    app.kubernetes.io/managed-by: kustomize
  name: garam-construction-role
rules:
- apiGroups:
  - agent.garam.sh
  resources:
  - agents
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
