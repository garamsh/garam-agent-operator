# permission to replace the credential this operator authenticates to garam
# with. It is a patch and not a read: the operator learns its credential from
# the file its Pod mounts, and reaches the API only to write a renewal.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: garam-agent-operator
    app.kubernetes.io/managed-by: kustomize
  name: garam-credential-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  resourceNames:
  - garam-credential
  verbs:
  - patch
