# The registry the e2e suite's node pulls the stand-in agent image from. The
# suite applies it into its own namespace, and Dependabot moves its image.
# REGISTRY_HTTP_ADDR is agentImageRegistry in test/e2e/agent_image_test.go,
# which checks the two agree.
apiVersion: v1
kind: Pod
metadata:
  name: registry
spec:
  hostNetwork: true
  containers:
    - name: registry
      image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
      env:
        - name: REGISTRY_HTTP_ADDR
          value: localhost:5000
